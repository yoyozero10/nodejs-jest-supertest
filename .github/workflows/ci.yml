name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/devops
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t nodejs-jest-supertest .

  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: ci
    if: always()

    steps:
      - name: Notify success
        if: needs.ci.result == 'success'
        run: echo "CI Pipeline completed successfully. All steps passed."

      - name: Notify failure
        if: needs.ci.result == 'failure'
        run: |
          echo "CI Pipeline failed. Please check the logs for details."
          exit 1
